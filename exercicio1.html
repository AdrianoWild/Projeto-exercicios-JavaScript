<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercicio 1</title>
<link rel="stylesheet" href="estilopadrao.css">
</head>

<body>

    <h1>Exercício 1</h1>

    <div class="center-container">
        <div class="message-card">
            <h2>Mensagem do sistema</h2>

            <button onclick="cadastrar()">Cadastrar alunos</button>

            <br><br>

            <a href="index.html">Voltar à tela anterior</a>
        </div>
    </div>

    <script>
        function cadastrar()
        {
            let alunos = []
            for (let i = 0;i < 3;i++)
            {
                alunos[i] = prompt('DIGITE O NOME DO ' + (i + 1) + 'º ALUNO:')
            }
            alert('OS NOMES DOS ALUNOS CADASTRADOS SÃO: ' + alunos + '.')
        }
    </script>

</body>
</html>
