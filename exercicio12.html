<div class="center-container">
    <div class="message-card">
        <h2>Mensagem do sistema</h2>

        <button onclick="exibirnome()">
            Exibir nomes
        </button>

        <br><br>

        <a href="index.html">Voltar à tela anterior</a>

<script>
function exibirnome() 
{
    let nomes = ['JOÃO','SANDRO','TELMA','REGINA','TÚLIO']
    let resultado = ""

    for (let i = 0; i < nomes.length; i++) 
    {
        resultado += i + " - " + nomes[i] + "\n"
    }

    alert(resultado)
}
</script>
