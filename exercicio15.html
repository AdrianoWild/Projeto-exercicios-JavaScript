<body>

<h1>Exercício 15</h1>

<div class="center-container">
    <div class="message-card">
        <h2>Mensagem do sistema</h2>

        <button onclick="atualizarnome()">
            Atualizar o nome
        </button>

        <br><br>

        <a href="index.html">Voltar à tela anterior</a>
    </div>
</div>

<script>
function atualizarnome() 
{
    let nomes = []
    let resposta = 'SIM'

    while (resposta === 'SIM') 
    {
        let nome = prompt('DIGITE UM NOME:')
        nomes.push(nome)

        alert('NOME ATUALIZADO: ' + nome)

        resposta = prompt('DESEJA CONTINUAR? DIGITE SIM OU NAO')

        if (!resposta) break

        resposta = resposta.toUpperCase()
    }
}
</script>

</body>
