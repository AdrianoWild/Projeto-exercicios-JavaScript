<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercício 3</title>
<link rel="stylesheet" href="estilopadrao.css">
</head>

<body>

<h1>Exercício 3</h1>

<div class="center-container">
    <div class="message-card">
        <h2>Mensagem do sistema</h2>

        <button onclick="calculoquantidade()">
            Calcular número de alunos cadastrados
        </button>

        <br><br>

        <a href="index.html">Voltar à tela anterior</a>
    </div>
</div>

<script>
function calculoquantidade() 
{
    let alunos = [];
    let resposta = 'SIM';
    let posicao = 0;

    while (resposta === 'SIM') 
    {
        let nome = prompt('DIGITE O NOME DO ' + (posicao + 1) + 'º ALUNO:');

        if (nome) 
        {
            alunos.push(nome);
            posicao++;
        }

        resposta = prompt('DESEJA CONTINUAR? (SIM ou NAO)');
        
        if (!resposta)
        {
            break;
        } 

        resposta = resposta.toUpperCase();
    }

    alert('O TOTAL DE ALUNOS CADASTRADOS É ' + alunos.length + '.');
}
</script>

</body>
</html>
