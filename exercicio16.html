<body>

<h1>Exercício 16</h1>

<div class="center-container">
    <div class="message-card">
        <h2>Mensagem do sistema</h2>

        <button onclick="classificaraluno()">
            Exibir quantidade de alunos aprovados
        </button>

        <br><br>

        <a href="index.html">Voltar à tela anterior</a>
    </div>
</div>

<script>
function classificaraluno()
{
    let notas = [4,2,8,9,10,5.5,9.8,1,3.3,4.6,8.5]
    let quantalunosaprovados = 0

    for (let i = 0; i < notas.length; i++)
    {
        if (notas[i] >= 7)
        {
            quantalunosaprovados++
        }
    }

    alert('A QUANTIDADE DE ALUNOS APROVADOS É ' + quantalunosaprovados + ' ALUNOS.')
}
</script>

</body>
