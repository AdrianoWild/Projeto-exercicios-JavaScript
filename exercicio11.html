<h1>Exercício 11</h1>

<div class="center-container">
    <div class="message-card">
        <h2>Mensagem do sistema</h2>

        <button onclick="situacaoaluno()">
            Exibir a situação do aluno
        </button>

        <br><br>

        <a href="index.html">Voltar à tela anterior</a>
    </div>
</div>

<script>
function situacaoaluno()
{
    let notas = [7.5,10.5,3.4]
    let somanotas = 0

    for (let i = 0; i < notas.length; i++)
    {
        somanotas += notas[i]
    }

    let medianotas = somanotas / 3

    if (medianotas >= 7)
    {
        alert('O ALUNO FOI APROVADO.')
    }
    else if (medianotas >= 4 && medianotas < 7)
    {
        alert('O ALUNO ESTÁ EM RECUPERAÇÃO.')
    }
    else
    {
        alert('O ALUNO FOI REPROVADO.')
    }
}
</script>
