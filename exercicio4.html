<!DOCTYPE html>
<html lang="pt-br">
<head>

<body>

<h1>Exercício 4</h1>

<div class="center-container">
    <div class="message-card">
        <h2>Mensagem do sistema</h2>

        <button onclick="maiormenor()">
            Calcular maior e menor idade
        </button>

        <br><br>

        <a href="index.html">Voltar à tela anterior</a>
    </div>
</div>

<script>
function maiormenor()
{
    let maioridade = 0
    let menoridade = 0

    let primeiraidade = prompt('DIGITE A PRIMEIRA IDADE:')
    let segundaidade = prompt('DIGITE A SEGUNDA IDADE:')

    if (primeiraidade > segundaidade)
    {
        maioridade = primeiraidade
    }
    else
    {
        maioridade = segundaidade
    }

    if (primeiraidade < segundaidade)
    {
        menoridade = primeiraidade
    }
    else
    {
        menoridade = segundaidade
    }

    alert('A MAIOR IDADE É ' + maioridade + ' ANOS E A MENOR IDADE É ' + menoridade + ' ANOS.')
}
</script>

</body>
</html>
